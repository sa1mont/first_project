services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"


  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: python main.py runserver 0.0.0.0:8000
    depends_on:
      - db